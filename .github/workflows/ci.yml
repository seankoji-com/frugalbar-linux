name: Linux checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install native desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 gir1.2-xapp-1.0 libsecret-tools xvfb xauth dbus-x11 librsvg2-common
      - name: Verify provider semantics and GTK interactions
        run: sh scripts/check-linux.sh
      - name: Preserve actual GTK screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-screenshots
          path: .artifacts/screenshots
          if-no-files-found: ignore
